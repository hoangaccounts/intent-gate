name: IntentGate

on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install action dependencies
        working-directory: action
        run: npm ci

      - name: Run IntentGate
        uses: ./action
        with:
          intent_path: intent.yml
